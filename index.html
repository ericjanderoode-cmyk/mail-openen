<style>body{font:17px Inter,-apple-system,Helvetica,sans-serif;text-align:center;padding:72px 20px;color:#e6e9f2;background:linear-gradient(#0b1020,#05070c);min-height:100vh;margin:0;box-sizing:border-box}#a{display:none;margin-top:18px;padding:12px 22px;background:linear-gradient(90deg,#5ff3d0,#4cc3ff,#8b6bff);color:#05070c;font-weight:600;border-radius:12px;text-decoration:none}#g{display:none;margin-top:22px;color:#9aa3b8;font-size:15px}#t{display:inline-block;margin-top:30px;padding:12px 22px;border:1px solid #2a3350;border-radius:12px;color:#e6e9f2;text-decoration:none;font-weight:600}p.s{color:#9aa3b8;font-size:14px;margin-top:28px}</style>
</head><body>
<p id="m">Mail wordt geopend in Apple Mail…</p>
<a id="a" href="#">✉ Mail openen</a><br>
<a id="g" href="#">Niet gevonden in Apple Mail? Open in Gmail</a><br>
<a id="t" href="#">← Terug naar Cockpit</a>
<p class="s">Klaar in Mail? Tik linksboven op ◀ en je komt vanzelf terug in de cockpit.</p>
<script>(function(){var raw=(location.hash||"").slice(1),mid="",g="";
if(raw.indexOf("m=")===0){raw.split("&").forEach(function(p){var i=p.indexOf("=");if(i<0)return;var k=p.slice(0,i),v=decodeURIComponent(p.slice(i+1));if(k==="m")mid=v;if(k==="g")g=v})}else{mid=decodeURIComponent(raw)}
mid=mid.replace(/^<|>$/g,"");
var ok=/^[A-Za-z0-9!#$%&'*+\/=?^_`{|}~.\-]{1,250}@[A-Za-z0-9.\-]{1,250}$/.test(mid);
var C="https://claude.ai/artifact/AbauX1iQj9RK6FJxJ7kQvw",t=document.getElementById("t"),weg=false,klaar=false;t.href=C;function terug(){if(klaar)return;klaar=true;try{window.close()}catch(e){}setTimeout(function(){if(history.length>1)history.back();else location.replace(C)},300)}document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")weg=true;else if(weg)terug()});window.addEventListener("pageshow",function(e){if(e.persisted)terug()});var a=document.getElementById("a"),m=document.getElementById("m"),b=document.getElementById("g");
if(/^[0-9a-f]{12,16}$/.test(g)){var dec=BigInt("0x"+g).toString();b.href="https://mail.google.com/mail/?authuser=ericjan.deroode@synergygroup.nl#all/thread-f:"+dec+"|msg-f:"+dec;b.style.display="inline-block"}
if(!ok){m.textContent=b.style.display?"Mail niet in Apple Mail te openen.":"Ongeldige link.";return}
var u="message://"+encodeURIComponent("<"+mid+">");a.href=u;a.style.display="inline-block";location.replace(u)})();</script>
